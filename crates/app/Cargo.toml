[package]
name = "winrust"
description = "Winrust: a Winamp 2.x-style music player"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "winrust_app"
path = "src/lib.rs"

[dependencies]
# Linux builds X11 only: Wayland does not let windows place themselves (umbrella spec §8.3).
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11"] }
winrust-audio = { path = "../audio" }
winrust-ui = { path = "../ui" }

[dev-dependencies]
tempfile = "3"
