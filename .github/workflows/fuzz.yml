name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - "crates/skin/**"
      - "crates/audio/src/icy.rs"
      - ".github/workflows/fuzz.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bmp, skin_archive, icy]
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins stable; `cargo +nightly` below overrides it.
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=${{ github.event_name == 'pull_request' && 60 || 600 }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts
